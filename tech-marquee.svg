<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="850" height="150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#101726"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="frame"><rect width="850" height="150" rx="14"/></clipPath>
    <style>
      .chip{font-family:'Courier New',Courier,monospace;font-size:12.5px;font-weight:bold;fill:#e2e8f0;letter-spacing:.3px}
      .label{font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:bold;fill:#6e7681;letter-spacing:3px}
      .fade{opacity:0;animation:fadeIn .9s ease-out .1s forwards}
      @keyframes fadeIn{to{opacity:1}}
    </style>
  </defs>

  <rect width="850" height="150" rx="14" fill="url(#bg)" stroke="#21262d" stroke-width="1.5"/>
  <rect width="850" height="150" rx="14" fill="url(#dots)"/>

  <g clip-path="url(#frame)">
