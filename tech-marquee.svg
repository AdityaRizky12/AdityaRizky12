<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 50" width="100%" height="50">
  <defs>
    <style>
      .track { animation: marquee 22s linear infinite; }
      .track:hover { animation-play-state: paused; }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-1190px); }
      }
      .pill { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 16; }
      .txt { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #e6edf3; font-weight: bold; }
      .fade-left { fill: url(#gradL); }
      .fade-right { fill: url(#gradR); }
    </style>
    <linearGradient id="gradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
  </defs>

  <g class="track">
    <!-- SET 1 -->
    <g transform="translate(0, 9)">
      <rect x="10" y="0" width="105" height="32" class="pill" />
      <circle cx="28" cy="16" r="4" fill="#61dafb" /><text x="40" y="20" class="txt">React.js</text>

      <rect x="125" y="0" width="100" height="32" class="pill" />
      <circle cx="143" cy="16" r="4" fill="#ffffff" /><text x="155" y="20" class="txt">Next.js</text>

      <rect x="235" y="0" width="120" height="32" class="pill" />
      <circle cx="253" cy="16" r="4" fill="#3178c6" /><text x="265" y="20" class="txt">TypeScript</text>

      <rect x="365" y="0" width="135" height="32" class="pill" />
      <circle cx="383" cy="16" r="4" fill="#38bdf8" /><text x="395" y="20" class="txt">Tailwind CSS</text>

      <rect x="510" y="0" width="100" height="32" class="pill" />
      <circle cx="528" cy="16" r="4" fill="#339933" /><text x="540" y="20" class="txt">Node.js</text>

      <rect x="620" y="0" width="120" height="32" class="pill" />
      <circle cx="638" cy="16" r="4" fill="#f7df1e" /><text x="650" y="20" class="txt">Express.js</text>

      <rect x="750" y="0" width="95" height="32" class="pill" />
      <circle cx="768" cy="16" r="4" fill="#2d3748" stroke="#38bdf8" stroke-width="1.5" /><text x="780" y="20" class="txt">Prisma</text>

      <rect x="855" y="0" width="105" height="32" class="pill" />
      <circle cx="873" cy="16" r="4" fill="#ffca28" /><text x="885" y="20" class="txt">Firebase</text>

      <rect x="970" y="0" width="90" height="32" class="pill" />
      <circle cx="988" cy="16" r="4" fill="#4479a1" /><text x="1000" y="20" class="txt">MySQL</text>

      <rect x="1070" y="0" width="110" height="32" class="pill" />
      <circle cx="1088" cy="16" r="4" fill="#ff2d20" /><text x="1100" y="20" class="txt">Laravel</text>
    </g>

    <!-- SET 2 -->
    <g transform="translate(1190, 9)">
      <rect x="10" y="0" width="105" height="32" class="pill" />
      <circle cx="28" cy="16" r="4" fill="#61dafb" /><text x="40" y="20" class="txt">React.js</text>

      <rect x="125" y="0" width="100" height="32" class="pill" />
      <circle cx="143" cy="16" r="4" fill="#ffffff" /><text x="155" y="20" class="txt">Next.js</text>

      <rect x="235" y="0" width="120" height="32" class="pill" />
      <circle cx="253" cy="16" r="4" fill="#3178c6" /><text x="265" y="20" class="txt">TypeScript</text>

      <rect x="365" y="0" width="135" height="32" class="pill" />
      <circle cx="383" cy="16" r="4" fill="#38bdf8" /><text x="395" y="20" class="txt">Tailwind CSS</text>

      <rect x="510" y="0" width="100" height="32" class="pill" />
      <circle cx="528" cy="16" r="4" fill="#339933" /><text x="540" y="20" class="txt">Node.js</text>

      <rect x="620" y="0" width="120" height="32" class="pill" />
      <circle cx="638" cy="16" r="4" fill="#f7df1e" /><text x="650" y="20" class="txt">Express.js</text>

      <rect x="750" y="0" width="95" height="32" class="pill" />
      <circle cx="768" cy="16" r="4" fill="#2d3748" stroke="#38bdf8" stroke-width="1.5" /><text x="780" y="20" class="txt">Prisma</text>

      <rect x="855" y="0" width="105" height="32" class="pill" />
      <circle cx="873" cy="16" r="4" fill="#ffca28" /><text x="885" y="20" class="txt">Firebase</text>

      <rect x="970" y="0" width="90" height="32" class="pill" />
      <circle cx="988" cy="16" r="4" fill="#4479a1" /><text x="1000" y="20" class="txt">MySQL</text>

      <rect x="1070" y="0" width="110" height="32" class="pill" />
      <circle cx="1088" cy="16" r="4" fill="#ff2d20" /><text x="1100" y="20" class="txt">Laravel</text>
    </g>
  </g>

  <rect x="0" y="0" width="50" height="50" class="fade-left" />
  <rect x="800" y="0" width="50" height="50" class="fade-right" />
</svg>
