<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.5" />
    </pattern>

    <style>
      .sub { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #6e7681; letter-spacing: 3px; font-weight: bold; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 42px; font-weight: 900; fill: url(#textGrad); }
      .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Background Kotak -->
  <rect width="850" height="260" rx="14" fill="url(#bg)" stroke="#21262d" stroke-width="1.5" />
  <rect width="850" height="260" rx="14" fill="url(#dots)" />

  <!-- Garis Biru Kiri -->
  <rect x="45" y="52" width="5" height="75" rx="2.5" fill="url(#barGrad)" />

  <!-- Teks Atas -->
  <text x="65" y="68" class="sub">JAKARTA  .  FULLSTACK</text>
  <text x="65" y="118" class="title">Aditya Rizky Ramadhan</text>

  <!-- ANIMASI TEKS MENGETIK (Typing SVG) -->
  <svg x="40" y="150" width="700" height="40">
    
  </svg>

  <!-- Quote Bawah -->
  <text x="45" y="218" class="quote">Code with intention. Design with compassion.</text>

  <!-- Ikon Orbit Koding di Kanan -->
  <g transform="translate(730, 130)">
    <ellipse cx="0" cy="0" rx="75" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="75" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="75" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(90)" />

    <circle cx="-55" cy="32" r="4.5" fill="#60a5fa" />
    <circle cx="52" cy="-30" r="3.5" fill="#818cf8" />
    <circle cx="0" cy="-75" r="3" fill="#38bdf8" />
    <circle cx="38" cy="50" r="2.5" fill="#6366f1" />

    <circle cx="0" cy="0" r="24" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M -6 -5 L -12 0 L -6 5 M 6 -5 L 12 0 L 6 5 M 2 -7 L -2 7" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
