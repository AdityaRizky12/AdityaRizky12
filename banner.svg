=<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="850" height="260" rx="14" fill="url(#bg)" stroke="#21262d" stroke-width="1.5" />
  <rect width="850" height="260" rx="14" fill="url(#dots)" />

  <rect x="45" y="52" width="5" height="75" rx="2.5" fill="url(#barGrad)" />

  <text x="65" y="68" font-family="monospace" font-size="12" fill="#6e7681" letter-spacing="3" font-weight="bold">JAKARTA  -  FULLSTACK</text>
  
  <text x="65" y="118" font-family="sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)">Aditya Rizky Ramadhan</text>
  
  <text x="45" y="175" font-family="monospace" font-size="20" fill="#e6edf3" font-weight="bold">> Junior Full Stack Developer</text>
  
  <rect x="405" y="157" width="11" height="21" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <text x="45" y="218" font-family="sans-serif" font-size="14" fill="#8b949e">Code with intention. Design with compassion.</text>

  <g transform="translate(730, 130)">
    <ellipse cx="0" cy="0" rx="75" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="75" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="75" ry="28" fill="none" stroke="#30363d" stroke-width="1.2" transform="rotate(90)" />

    <circle cx="-55" cy="32" r="4.5" fill="#60a5fa" />
    <circle cx="52" cy="-30" r="3.5" fill="#818cf8" />
    <circle cx="0" cy="-75" r="3" fill="#38bdf8" />
    <circle cx="38" cy="50" r="2.5" fill="#6366f1" />

    <circle cx="0" cy="0" r="24" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="5" font-family="monospace" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle"></></text>
