<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <!-- Background Gradient Gelap Elegan -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gradasi Teks Nama (Cyan ke Ungu Neon) -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Gradasi Garis Aksen Vertikal -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Pola Titik-Titik Grid Modern -->
    <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.12" />
    </pattern>

    <!-- Efek Cahaya Neon (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sub-title { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #38bdf8; letter-spacing: 4px; font-weight: bold; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 900; fill: url(#nameGrad); }
      .role { font-family: 'Courier New', Courier, monospace; font-size: 18px; fill: #f8fafc; font-weight: bold; }
      .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; font-style: italic; }
      .cursor { fill: #38bdf8; animation: blink 0.8s infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Kotak Utama dengan Border Neon Halus -->
  <rect width="850" height="260" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect width="850" height="260" rx="16" fill="url(#grid)" />

  <!-- Aksen Garis Vertikal di Samping Kiri -->
  <rect x="42" y="48" width="4" height="68" rx="2" fill="url(#barGrad)" filter="url(#neonGlow)" />

  <!-- Label Atas -->
  <text x="60" y="64" class="sub-title">📍 JAKARTA, INDONESIA  //  FULLSTACK DEV</text>
  
  <!-- Nama Utama -->
  <text x="60" y="114" class="name" filter="url(#neonGlow)">Aditya Rizky Ramadhan</text>

  <!-- Baris Role dengan Ikon Terminal & Kursor Menyala -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" class="role">
      <tspan fill="#38bdf8">></tspan> Full Stack Developer
    </text>
    <!-- Kotak Kursor Berkedip -->
    <rect x="252" y="-16" width="10" height="20" class="cursor" rx="2" />
  </g>

  <!-- Quote di Bagian Bawah -->
  <text x="60" y="212" class="quote">“Code with intention. Design with compassion.”</text>

  <!-- Ilustrasi Ikon Koding di Sebelah Kanan (Orbit Atom Modern) -->
  <g transform="translate(720, 130)" filter="url(#neonGlow)">
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#e879f9" stroke-width="1" stroke-opacity="0.4" transform="rotate(90)" />

    <!-- Titik Elektron Bergerak di Orbit -->
    <circle cx="-60" cy="30" r="4" fill="#38bdf8" />
    <circle cx="55" cy="-25" r="3" fill="#e879f9" />
    <circle cx="0" cy="-70" r="3.5" fill="#818cf8" />

    <!-- Inti Lingkaran Tengah -->
    <circle cx="0" cy="0" r="26" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
    <!-- Simbol Code </> di dalam Inti -->
    <path d="M -8 -6 L -15 0 L -8 6 M 8 -6 L 15 0 L 8 6 M 3 -8 L -3 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
