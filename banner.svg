<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gradasi nama: bergeser terus (shimmer) -->
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="60" y1="0" x2="460" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
      <animate attributeName="x1" values="60;460" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="460;860" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Grid titik yang bergeser pelan -->
    <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.12" />
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="24 24" dur="6s" repeatCount="indefinite" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Jalur orbit elips untuk elektron -->
    <path id="orbitPath" d="M -70 0 A 70 26 0 1 1 70 0 A 70 26 0 1 1 -70 0" />

    <!-- Mask untuk efek mengetik -->
    <clipPath id="typeClip">
      <rect x="0" y="-22" height="32" width="0">
        <animate attributeName="width" calcMode="discrete" begin="0.8s" dur="7s" repeatCount="indefinite"
          values="0;11;22;33;44;55;66;77;88;99;110;121;132;143;154;165;176;187;198;209;220;231;242;253"
          keyTimes="0;0.0174;0.0348;0.0522;0.0696;0.087;0.1043;0.1217;0.1391;0.1565;0.1739;0.1913;0.2087;0.2261;0.2435;0.2609;0.2783;0.2957;0.313;0.3304;0.3478;0.3652;0.3826;0.4" />
      </rect>
    </clipPath>

    <style>
      .sub-title { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #38bdf8; letter-spacing: 4px; font-weight: bold; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 900; fill: url(#nameGrad); }
      .role { font-family: 'Courier New', Courier, monospace; font-size: 18px; fill: #f8fafc; font-weight: bold; }
      .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; font-style: italic; }
      .cursor { fill: #38bdf8; animation: blink 0.8s infinite; }

      /* Muncul bertahap */
      .fade { opacity: 0; animation: fadeIn 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.1s; }
      .d2 { animation-delay: 0.4s; }
      .d3 { animation-delay: 0.7s; }
      .d4 { animation-delay: 1.2s; }
      .d5 { animation-delay: 0.3s; }

      .bar { animation: barPulse 3s ease-in-out infinite; }
      .core { animation: corePulse 2.5s ease-in-out infinite; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes barPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @keyframes corePulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
    </style>
  </defs>

  <rect width="850" height="260" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect width="850" height="260" rx="16" fill="url(#grid)" />

  <!-- Garis vertikal -->
  <g class="fade d1">
    <rect class="bar" x="42" y="48" width="4" height="68" rx="2" fill="url(#barGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Label atas -->
  <text x="60" y="64" class="sub-title fade d1">📍 JAKARTA, INDONESIA  //  FULLSTACK DEV</text>

  <!-- Nama (gradasi bergeser) -->
  <text x="60" y="114" class="name fade d2" filter="url(#neonGlow)">Aditya Rizky Ramadhan</text>

  <!-- Role: efek mengetik + kursor mengikuti -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" class="role" clip-path="url(#typeClip)">
      <tspan fill="#38bdf8">></tspan> Full Stack Developer
    </text>
    <rect x="0" y="-16" width="10" height="20" class="cursor" rx="2">
      <animate attributeName="x" calcMode="discrete" begin="0.8s" dur="7s" repeatCount="indefinite"
        values="0;11;22;33;44;55;66;77;88;99;110;121;132;143;154;165;176;187;198;209;220;231;242;253"
        keyTimes="0;0.0174;0.0348;0.0522;0.0696;0.087;0.1043;0.1217;0.1391;0.1565;0.1739;0.1913;0.2087;0.2261;0.2435;0.2609;0.2783;0.2957;0.313;0.3304;0.3478;0.3652;0.3826;0.4" />
    </rect>
  </g>

  <!-- Quote -->
  <text x="60" y="212" class="quote fade d4">“Code with intention. Design with compassion.”</text>

  <!-- Atom: elektron berputar di orbit -->
  <g transform="translate(720, 130)" filter="url(#neonGlow)" class="fade d5">
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle r="4" fill="#38bdf8">
        <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#orbitPath" /></animateMotion>
      </circle>
    </g>
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle r="3.5" fill="#818cf8">
        <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#orbitPath" /></animateMotion>
      </circle>
    </g>
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#e879f9" stroke-width="1" stroke-opacity="0.4" />
      <circle r="3" fill="#e879f9">
        <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#orbitPath" /></animateMotion>
      </circle>
    </g>

    <!-- Inti berdenyut -->
    <circle class="core" cx="0" cy="0" r="26" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
    <path d="M -8 -6 L -15 0 L -8 6 M 8 -6 L 15 0 L 8 6 M 3 -8 L -3 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
